name: Append exact Chicago metro mirror without regeneration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ride-tiles-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore hash-pinned public snapshot without network downloads
        run: python publishing/restore_snapshot.py site
      - name: Append and verify exact immutable metro mirror
        run: python publishing/append_metro.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
